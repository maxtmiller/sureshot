[project]
name = "sureshot"
version = "0.1.0"
description = "Fast, calibrated decisions from a System 1 model, with escalation to a stronger System 2 model when it's unsure"
authors = [{ name = "Maximilian Miller" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["httpx"]

[project.urls]
Homepage = "https://github.com/maxtmiller/sureshot"
Issues = "https://github.com/maxtmiller/sureshot/issues"

[project.scripts]
sureshot = "sureshot.cli:main"

[project.optional-dependencies]
claude = ["anthropic"]
yaml = ["pyyaml"]
api = ["fastapi", "uvicorn", "python-dotenv", "pyyaml"]
local = ["scikit-learn", "sentence-transformers"]
dev = ["pytest", "anthropic", "fastapi", "uvicorn", "python-dotenv", "scikit-learn", "pyyaml"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sureshot", "sureshot.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
