# System 1 on your own GPU with vLLM, next to the sureshot API. From the repo root:
#   cp .env.example .env     # set SURESHOT_SYSTEM1_MODEL, SURESHOT_API_KEY and the System 2 settings (SURESHOT_SYSTEM2_*, or a provider key such as ANTHROPIC_API_KEY)
#   docker compose -f serve/docker-compose.yml up --build
# Needs Docker with the NVIDIA container toolkit. The sureshot API is then at http://localhost:8000/decide.
services:
  vllm:
    image: vllm/vllm-openai:latest
    command: --model ${SURESHOT_SYSTEM1_MODEL} --enable-prefix-caching --max-logprobs 20 --max-model-len 4096
    ipc: host
    environment:
      - HF_TOKEN
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      retries: 60

  sureshot:
    build:
      context: ..
      dockerfile: serve/Dockerfile
    env_file: ../.env
    environment:
      SURESHOT_SYSTEM1: vllm
      SURESHOT_SYSTEM1_URL: http://vllm:8000/v1
      SURESHOT_DB: /data/sureshot.db
    volumes:
      - sureshot-data:/data
    ports:
      - "8000:8000"
    depends_on:
      vllm:
        condition: service_healthy

volumes:
  sureshot-data:
